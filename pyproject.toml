[project]
name = "ai-utils"
version = "0.7.9"
description = ""
authors = [
    {name = "u2084511felix",email = "79988595+u2084511felix@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai (>=1.70.0)",
    "pydantic (>=2.11.2,<3.0.0)",
    "datamodel-code-generator (>=0.28.5,<0.29.0)",
    "tiktoken (>=0.9.0)"
]

[tool.poetry]
packages = [{include = "aiutils"}]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-asyncio = "*"
pytest-cov = "*"
pre-commit = ">=4.0,<5.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.coverage.run]
source = ["aiutils"]
branch = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
