repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: pytest
        name: pytest (full suite)
        entry: poetry run pytest -q
        language: system
        pass_filenames: false
        always_run: true
